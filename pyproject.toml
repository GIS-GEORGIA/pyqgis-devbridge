[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqgis-devbridge"
version = "0.10.0"
description = "Automated PyQGIS development environment setup + live debug bridge for VS Code / PyCharm (bilingual EN/KA)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Giorgi Kapanadze (Kapo)", email = "kapan.gio777@gmail.com" }
]
keywords = ["qgis", "pyqgis", "gis", "debugging", "vscode", "pycharm", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "debugpy>=1.8",
]

[project.optional-dependencies]
gui = []
dev = ["pytest>=7.0"]

[project.scripts]
devbridge = "devbridge.cli:main"

[project.urls]
Homepage = "https://github.com/GIS-GEORGIA/pyqgis-devbridge"
Repository = "https://github.com/GIS-GEORGIA/pyqgis-devbridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Without this, a real (non-editable) wheel silently drops the i18n JSON files -
# `pip install -e .` (used throughout this repo's own testing) never notices,
# because an editable install just points back at the source tree.
devbridge = ["i18n/*.json"]
